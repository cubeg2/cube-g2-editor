name: Swift

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v4

      - name: Install libusb
        run: brew install libusb

      - name: Build
        run: swift build

      - name: Run tests
        run: swift test
