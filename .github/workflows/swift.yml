name: Swift

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    # macOS minutes are free only for public repositories: the public repository builds
    # every push, a private copy only version tags and manual runs (Actions ▸ Run workflow).
    if: github.repository == 'cubeg2/cube-g2-editor' || github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v7

      - name: Install libusb
        run: brew install libusb

      - name: Build
        run: swift build

      - name: Run tests
        run: swift test
